[package]
name = "hop"
version = "0.1.12"
edition = "2024"
description = "Send chosen Bluetooth devices between two Macs"
license = "Apache-2.0"
publish = false

[dependencies]
# Same GPUI pin as Stand. The platform crate is not on crates.io.
gpui = { git = "https://github.com/zed-industries/zed", rev = "06afd454ec3f23b7c97ce7527e9be9e1478564a4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "06afd454ec3f23b7c97ce7527e9be9e1478564a4", features = [
    "font-kit",
] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release builds keep a symbol table Cargo does not need in the shipped app.
[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
block = "0.1.6"
raw-window-handle = "0.6"
